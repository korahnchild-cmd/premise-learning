<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  body{ font-family:"Pretendard","Inter",sans-serif; -webkit-font-smoothing:antialiased; letter-spacing:-.012em; background:#F5F6F4; color:#0A0E17; }
  h1,h2{ letter-spacing:-.03em; }
  ::selection{ background:rgba(10,102,255,.14); }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:.65rem; border-radius:9999px; transition:transform .3s cubic-bezier(.16,1,.3,1), background .25s, border-color .25s, box-shadow .25s; }
  .btn:active{ transform:scale(.98); }
  .btn-google{ background:#fff; color:#0A0E17; border:1px solid #DFE3E8; box-shadow:0 2px 10px rgba(10,14,23,.05); }
  .btn-google:hover{ border-color:#0A66FF; transform:translateY(-1px); box-shadow:0 6px 16px rgba(10,14,23,.08); }
  .btn-kakao{ background:#FEE500; color:#191600; }
  .btn-kakao:hover{ transform:translateY(-1px); box-shadow:0 6px 16px rgba(254,229,0,.35); }
  .btn-naver{ background:#03C75A; color:#fff; }
  .btn-naver:hover{ transform:translateY(-1px); box-shadow:0 6px 16px rgba(3,199,90,.28); }
  .card{ background:#fff; border:1px solid #ECEEF1; border-radius:2rem; }
  .kozy{ display:inline-block; }
  .kozy svg{ width:100%; height:100%; overflow:visible; display:block; }
  .k-face{ fill:rgba(10,102,255,.10); } .k-face.top{ fill:rgba(10,102,255,.16); } .k-face.right{ fill:rgba(10,102,255,.05); }
  .k-edge{ fill:none; stroke:#0A66FF; stroke-width:2.4; stroke-linejoin:round; stroke-linecap:round; }
  .k-core{ fill:#0A66FF; filter:drop-shadow(0 0 4px rgba(10,102,255,.85)); }
  .k-wrap{ transform-origin:50% 55%; animation:kfloat 4s ease-in-out infinite; }
  @keyframes kfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .k-core{ animation:kpulse 2.4s ease-in-out infinite; }
  @keyframes kpulse{0%,100%{opacity:.75;transform:scale(1);transform-origin:50% 50%}50%{opacity:1;transform:scale(1.35)}}
  @media (prefers-reduced-motion:reduce){ *{animation:none!important} }
  .toast{ position:fixed; left:50%; bottom:28px; transform:translate(-50%,12px); opacity:0; pointer-events:none; transition:transform .35s cubic-bezier(.16,1,.3,1), opacity .35s; }
  .toast.show{ transform:translate(-50%,0); opacity:1; }
</style>
</head>
<body class="min-h-screen flex flex-col">

<header class="px-5 py-5">
  <div class="max-w-xl mx-auto">
    <a href="index.html" class="inline-flex items-center gap-2.5 font-bold text-[15px] text-ink">
      <svg width="26" height="26" viewBox="0 0 40 40" aria-label="PBS 학습법 로고">
        <defs><clipPath id="logoClip"><circle cx="20" cy="20" r="18"/></clipPath></defs>
        <circle cx="20" cy="20" r="18" fill="#0A66FF"/>
        <rect x="-8" y="17" width="56" height="6.5" fill="#0A0E17" transform="rotate(-34 20 20)" clip-path="url(#logoClip)"/>
      </svg>
      PBS 학습법
    </a>

<main class="flex-1 flex items-center justify-center px-5 pb-16">
  <div class="w-full max-w-[420px]">
    <div class="text-center mb-8">
      <div class="kozy mx-auto mb-6" style="width:76px;height:76px" id="kIcon"></div>
      <h1 class="text-[1.7rem] md:text-[1.9rem] font-extrabold leading-tight" id="headline">로그인하고<br>루카를 만나자</h1>
      <p class="mt-3 text-[14px] text-body leading-relaxed" id="subline">7일 무료체험은 신용카드 없이, 로그인만 하면 바로 시작할 수 있어.</p>
    </div>

    <!-- 카카오톡·인스타 등 인앱 브라우저 경고. 감지되면 JS가 hidden을 걷어낸다.
         인앱 WebView는 OAuth 왕복 중 저장소가 끊기거나 별도 컨텍스트로 돌아와서
         로그인이 산발적으로 실패한다. 베타 테스터는 카톡으로 링크를 받으므로
         대부분 이 안에서 열게 된다 — 안내문만으로는 못 막는다. -->
    <div id="inappWarn" class="hidden" style="margin-bottom:16px;border:1px solid #FCD34D;background:#FFFBEB;border-radius:16px;padding:16px 18px;text-align:left">
      <p style="margin:0;font-size:14px;font-weight:800;color:#78350F">카카오톡 안에서 열려 있어요</p>
      <p style="margin:6px 0 0;font-size:13px;line-height:1.65;color:#92400E">
        이 화면에서는 <b>로그인이 실패할 수 있습니다.</b> 아래 버튼으로 크롬·사파리에서 열면 정상 동작합니다.
      </p>
      <button id="openExternalBtn" type="button"
              style="margin-top:12px;width:100%;cursor:pointer;border:none;border-radius:9999px;padding:12px 16px;font-size:14px;font-weight:800;color:#0A0E17;background:#FFB800">
        다른 브라우저에서 열기
      </button>
      <p id="inappManual" style="margin:10px 0 0;font-size:12.5px;line-height:1.6;color:#92400E">
        버튼이 안 되면 오른쪽 아래 <b>⋮</b> 또는 <b>···</b> → <b>다른 브라우저로 열기</b>를 눌러주세요.
      </p>
    </div>

    <div class="card p-7 md:p-8">
      <div class="flex flex-col gap-3">
        <button class="btn btn-google w-full py-3.5 text-[14.5px] font-semibold" onclick="loginWith('google')">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 01-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.87 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.81.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 009 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 013.68 9c0-.59.1-1.17.27-1.7V4.97H.98A9 9 0 000 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 00.98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
          구글로 계속하기
        </button>
        <button class="btn btn-kakao w-full py-3.5 text-[14.5px] font-semibold" onclick="loginWith('kakao')">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#191600" d="M9 2C4.86 2 1.5 4.71 1.5 8.06c0 2.14 1.4 4.02 3.5 5.1-.15.55-.55 2.02-.63 2.34-.1.4.15.4.32.29.13-.08 2.1-1.43 2.96-2.02.43.06.87.09 1.35.09 4.14 0 7.5-2.71 7.5-6.06S13.14 2 9 2z"/></svg>
          카카오로 계속하기
        </button>
        <button class="btn btn-naver w-full py-3.5 text-[14.5px] font-semibold" onclick="loginWith('naver')">
          <svg width="16" height="16" viewBox="0 0 18 18"><path fill="#fff" d="M11.4 9.7L6.7 3H3v12h4.6V8.3L12.3 15H16V3h-4.6v6.7z"/></svg>
          네이버로 계속하기
        </button>
      </div>

      <p class="text-center text-[11.5px] text-faint mt-6 leading-relaxed">계속 진행하면 <a href="terms.html" class="underline hover:text-ink">이용약관</a> 및 <a href="privacy.html" class="underline hover:text-ink">개인정보처리방침</a>에 동의하는 것으로 간주됩니다.</p>
    </div>

    <p class="text-center text-[13px] text-faint mt-6"><a href="pricing.html" class="hover:text-ink transition">← 요금 안내로 돌아가기</a></p>
  </div>
</main>

<div class="toast bg-ink text-white text-[13px] font-semibold px-5 py-3 rounded-full shadow-lg" id="toast"></div>

<script src="common.js"></script>
<script type="module" src="firebase-init.js"></script>
<script>
  function kozySVG(){ return `<svg viewBox="0 0 100 100" aria-label="루카"><g class="k-wrap">
    <polygon class="k-face top" points="50,15 82,33 50,50 18,33"/>
    <polygon class="k-face right" points="82,33 82,67 50,85 50,50"/>
    <polygon class="k-face left" points="18,33 50,50 50,85 18,67"/>
    <polygon class="k-edge" points="50,15 82,33 82,67 50,85 18,67 18,33"/>
    <path class="k-edge" d="M50,50 L82,33 M50,50 L18,33 M50,50 L50,85"/>
    <circle class="k-core" cx="50" cy="50" r="4.5"/>
  </g></svg>`; }
  document.getElementById("kIcon").innerHTML = kozySVG();

  // 카카오/네이버는 이 페이지 자체를 Redirect URI로 등록해뒀음. client_id는 로그인 URL에
  // 그대로 노출되는 공개 식별자라 상수로 둬도 안전함(비밀값은 Cloud Functions 쪽에만 있음).
  const KAKAO_REST_API_KEY = "0cb21928fc35c5208313275e61c494a8";
  const NAVER_CLIENT_ID = "oszEVpQJxCwTX02g6TBN";
  const REDIRECT_URI = "https://pbslearning.co.kr/login.html";

  const params = new URLSearchParams(location.search);
  const oauthCode = params.get("code");
  const oauthState = params.get("state");
  const oauthError = params.get("error");

  /* ===== OAuth 왕복 보관소 =====
     예전엔 sessionStorage만 썼다. sessionStorage는 '탭 단위'라, 카카오톡·인스타 같은
     인앱 WebView가 인증을 마치고 새 컨텍스트로 돌아오면 통째로 비어 있다. 그러면
     state 검증이 실패해 "로그인 확인에 실패했어"가 뜬다 — 2026-08-02에 실제로 발생.
     localStorage는 오리진 단위라 이 왕복을 견딘다. state는 CSRF 방지용 1회성 난수이므로
     10분 TTL + 사용 즉시 폐기로 관리하면 localStorage에 둬도 안전하다.
     구버전 세션과의 호환을 위해 sessionStorage에도 같이 쓰고, 읽을 때 둘 다 본다. */
  const OA_TTL = 30 * 60 * 1000;   /* 2026-08-20: 10분 → 30분. 카카오·네이버 동의 화면에서
     계정 가입이나 2단계 인증을 거치면 10분을 넘길 수 있고, 넘기면 !fresh로 로그인이 통째로
     실패한다. state는 1회성 CSRF 논스라 10분과 30분의 보안 차이는 미미하고, 실패 비용이 훨씬 크다. */
  function oaSet(k, v){
    try { localStorage.setItem("pbs_oauth_" + k, v); } catch(e){}
    try { sessionStorage.setItem("pbs_oauth_" + k, v); } catch(e){}
  }
  function oaGet(k){
    var v = null;
    try { v = localStorage.getItem("pbs_oauth_" + k); } catch(e){}
    if (v === null) { try { v = sessionStorage.getItem("pbs_oauth_" + k); } catch(e){} }
    return v;
  }
  function oaClear(){
    ["provider","state","next","mode","at"].forEach(function(k){
      try { localStorage.removeItem("pbs_oauth_" + k); } catch(e){}
      try { sessionStorage.removeItem("pbs_oauth_" + k); } catch(e){}
    });
  }
  function oaFresh(){
    var at = Number(oaGet("at") || 0);
    return at > 0 && (Date.now() - at) < OA_TTL;
  }

  // next: 로그인 후 이동할 페이지, mode: trial(무료체험) | checkout(바로결제) | plain
  // 카카오/네이버는 리다이렉트 왕복 중 쿼리가 code/state로 덮이므로 위 보관소로 들고 다닌다
  const next = params.get("next") || oaGet("next") || "onboarding.html";
  const mode = params.get("mode") || oaGet("mode") || "";

  /* ===== 인앱 브라우저 감지 ===== */
  function inAppBrowser(){
    var ua = navigator.userAgent || "";
    return /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\//i.test(ua);
  }
  (function mountInappWarn(){
    if (!inAppBrowser()) return;
    var box = document.getElementById("inappWarn");
    if (box) box.classList.remove("hidden");
    var btn = document.getElementById("openExternalBtn");
    if (!btn) return;
    var ua = navigator.userAgent || "";
    var isAndroid = /Android/i.test(ua);
    var isKakao = /KAKAOTALK/i.test(ua);
    /* 2026-08-20: iOS이면서 카카오톡이 아닌 인앱(네이버·인스타·페북·라인)에서는
       kakaotalk:// 스킴이 먹지 않아 버튼이 눌러도 아무 일도 하지 않는다.
       죽은 버튼을 보여주느니 감추고 수동 안내만 남긴다. */
    if (!isAndroid && !isKakao) {
      btn.style.display = "none";
      var man = document.getElementById("inappManual");
      if (man) man.innerHTML = "화면 오른쪽 위 또는 아래의 <b>\u22ef</b> 메뉴에서 <b>다른 브라우저로 열기</b>(또는 <b>Safari로 열기</b>)를 눌러 주세요.";
      return;
    }
    btn.addEventListener("click", function(){
      var url = location.href;
      if (isAndroid) {
        // 안드로이드: 크롬으로 강제 오픈 (인텐트 스킴)
        location.href = "intent://" + url.replace(/^https?:\/\//, "")
          + "#Intent;scheme=https;package=com.android.chrome;end";
      } else {
        // iOS 카카오톡: 외부 브라우저 오픈 스킴
        location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(url);
      }
    });
  })();

  if (mode === "checkout") {
    document.getElementById("headline").innerHTML = "로그인하고<br>결제를 계속하자";
    document.getElementById("subline").textContent = "선택한 플랜으로 바로 결제를 진행할게. 로그인만 하면 끝이야.";
  } else if (mode === "trial") {
    document.getElementById("headline").innerHTML = "로그인하고<br>7일 무료체험 시작";
    document.getElementById("subline").textContent = "신용카드 없이 바로 시작돼. 로그인은 체험 기록을 지켜주는 용도야.";
  }

  function showToast(text){
    const t = document.getElementById("toast");
    t.textContent = text;
    t.classList.add("show");
  }

  function randomState(){
    return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (String(Date.now()) + Math.random().toString(36).slice(2));
  }

  function startRedirectLogin(provider){
    const state = randomState();
    oaSet("provider", provider);
    oaSet("state", state);
    oaSet("next", next);
    oaSet("mode", mode);
    oaSet("at", String(Date.now()));

    const url = provider === "kakao"
      ? "https://kauth.kakao.com/oauth/authorize"
        + "?client_id=" + encodeURIComponent(KAKAO_REST_API_KEY)
        + "&redirect_uri=" + encodeURIComponent(REDIRECT_URI)
        + "&response_type=code&state=" + encodeURIComponent(state)
      : "https://nid.naver.com/oauth2.0/authorize"
        + "?client_id=" + encodeURIComponent(NAVER_CLIENT_ID)
        + "&redirect_uri=" + encodeURIComponent(REDIRECT_URI)
        + "&response_type=code&state=" + encodeURIComponent(state);
    location.href = url;
  }

  async function handleOAuthCallback(){
    const provider = oaGet("provider");
    const savedState = oaGet("state");
    const fresh = oaFresh();
    oaClear();
    history.replaceState(null, "", location.pathname); // code/state를 주소창에서 지움

    if (oauthError) { showToast("로그인이 취소됐어"); return; }
    if (!provider || !savedState || savedState !== oauthState || !fresh) {
      /* 여기까지 왔다는 건 카카오·네이버 인증 자체는 통과했는데 우리 쪽 대조에 실패한 것이다.
         인앱 브라우저에서 저장소가 끊겼을 때가 대부분이라, 원인과 탈출구를 같이 알려준다. */
      showToast(inAppBrowser()
        ? "카카오톡 안에서는 로그인이 끊길 수 있어. 위 '다른 브라우저에서 열기'를 눌러줘."
        : "로그인 확인에 실패했어. 다시 시도해줘.");
      var w = document.getElementById("inappWarn");
      if (w) w.classList.remove("hidden");
      return;
    }

    // firebase-init.js는 type="module"이라 비동기로 늦게 로드될 수 있음 —
    // 리다이렉트로 돌아온 직후엔 아직 준비 안 됐을 수 있어서 잠깐 기다려준다.
    for (let i = 0; i < 30 && !window.PremiseAuth; i++) {
      await new Promise(r => setTimeout(r, 100));
    }
    if (!window.PremiseAuth) { showToast("초기화가 늦어지고 있어. 새로고침해서 다시 시도해줘."); return; }

    try {
      const result = provider === "kakao"
        ? await PremiseAuth.signInWithKakaoCode(oauthCode)
        : await PremiseAuth.signInWithNaverCode(oauthCode, oauthState);
      PremiseStore.login(provider, result.name || "", (result.user && result.user.email) || "");
      showToast((provider === "kakao" ? "카카오" : "네이버") + " 계정으로 로그인했어");
      setTimeout(()=>{ location.href = next; }, 550);
    } catch (e) {
      console.error(e);
      showToast("로그인에 실패했어. 다시 시도해줘.");
    }
  }

  if (oauthCode || oauthError) {
    handleOAuthCallback();
  } else {
    /* 이미 로그인 상태면 바로 next로 — 단 '로컬 플래그'만 보고 튕기지 않는다.
       로컬이 stale하게 true로 남아 있으면(로그아웃 직후 인앱 브라우저 등) 로그인
       화면에 머무를 수가 없어 계정을 바꿀 방법이 사라진다. Firebase 인증이 확정되고
       실제 세션이 있을 때만 이동한다. Firebase가 안 뜨면 로그인 버튼을 그대로 둔다. */
    var _autoGoDone = false;
    var _autoGo = function(){
      if (_autoGoDone) return;
      var u = null;
      try { u = (window.PremiseAuth && PremiseAuth.auth && PremiseAuth.auth.currentUser) || null; } catch(e){}
      if (u && window.PremiseStore && PremiseStore.isLoggedIn()) { _autoGoDone = true; location.replace(next); }
    };
    document.addEventListener("premise:auth", _autoGo);
    setTimeout(_autoGo, 1500);
  }

  async function loginWith(provider){
    if (provider !== "google") { startRedirectLogin(provider); return; }
    if (!window.PremiseAuth) { showToast("잠시 후 다시 시도해줘"); return; }
    try {
      const result = await PremiseAuth.signInWithGoogle();
      const u = result.user;
      PremiseStore.login("google", u.displayName || "구글 파트너", u.email || "");
    } catch (e) {
      if (e && (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request")) return;
      console.error(e);
      showToast("구글 로그인에 실패했어. 다시 시도해줘.");
      return;
    }
    showToast("구글 계정으로 로그인했어");
    setTimeout(()=>{ location.href = next; }, 550);
  }
</script>
</body>
</html>
